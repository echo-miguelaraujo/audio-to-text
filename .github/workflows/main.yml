name: Gerar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do codigo
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar dependencias do projeto
        run: npm install

      - name: 5. Gerar pasta nativa do Android (Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 6. Compilar APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 7. Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LeitorDeVoz-APK
          path: android/app/build/outputs/apk/release/app-release.apk
